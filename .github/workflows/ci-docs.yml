name: Documentation Building

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 7 * * 1'

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Build and test documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation and test dependencies
        run: python -m pip install '.[docs,test]' pytest pytest-doctestplus
      # Examples create SQLite files; keep them out of the source tree.
      - name: Test documentation examples
        working-directory: ${{ runner.temp }}
        run: python -m pytest --doctest-rst --doctest-plus "$GITHUB_WORKSPACE/docs"
      - name: Build HTML documentation
        run: python -m sphinx -b html docs docs/_build/html
